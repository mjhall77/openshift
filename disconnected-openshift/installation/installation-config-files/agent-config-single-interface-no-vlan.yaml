apiVersion: v1alpha1
kind: AgentConfig
metadata:
  name: agent-config 
additionalNTPSources:
  - 0.north-america.pool.ntp.org
  - 1.north-america.pool.ntp.org
rendezvousIP: 192.168.1.1  # Pick an IP of one of the control plane servers
hosts:
  - hostname: master-0
    role: master
    interfaces:
      - name: eno1  # This doesn't need to be the actual interface name, it has to match the names below
        macAddress: 00:ef:44:21:e6:a6
    rootDeviceHints:
      deviceName: /dev/sda # Change this to the drive that OCP should install the OS on
    networkConfig:
      interfaces:
        - name: eno1  # Name of interface, recommend naming same as vlan
          type: ethernet
          state: up
          mtu: 9000
          ipv4:
            enabled: true
            address:
              - ip: 192.168.1.14
                prefix-length: 24
            dhcp: false
          ipv6:
            enabled: false
      dns-resolver:
        config:
          server:
            - 192.168.1.1
      routes:
        config:
          - destination: 0.0.0.0/0
            next-hop-address: 192.168.1.1
            next-hop-interface: eno1 # Match the name of the bond vlan interface
            table-id: 254
#####
  - hostname: worker-0
    role: worker
    interfaces:
      - name: eno1  # This doesn't need to be the actual interface name, it has to match the names below
        macAddress: 00:ef:44:21:e6:a7
    rootDeviceHints:
      deviceName: /dev/sda # Change this to the drive that OCP should install the OS on
    networkConfig:
      interfaces:
        - name: eno1 # Name of interface, recommend naming same as vlan
          type: ethernet 
          state: up
          mtu: 9000
          ipv4:
            enabled: true
            address:
              - ip: 192.168.1.30
                prefix-length: 24
            dhcp: false
          ipv6:
            enabled: false
      dns-resolver:
        config:
          server:
            - 192.168.1.1
      routes: 
        config:
          - destination: 0.0.0.0/0
            next-hop-address: 192.168.1.1
            next-hop-interface: eno1 # Match the name of the bond vlan interface
            table-id: 254
